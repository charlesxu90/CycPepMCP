mcps:
  CPMP_mcp:
    dependencies: []
    description: '> Cyclic Peptide Membrane Permeability prediction toolkit - MCP
      tools for cyclic peptide computation...'
    env_vars: {}
    path: tool-mcps/cpmp_mcp
    runtime: python
    server_args:
    - src/server.py
    server_command: python
    setup_commands:
    - '(command -v mamba >/dev/null 2>&1 && mamba create -p ./env python=3.10 -y)
      || (command -v conda >/dev/null 2>&1 && conda create -p ./env python=3.10 -y)
      || (echo "Warning: Neither mamba nor conda found, creating venv instead" &&
      python3 -m venv ./env)'
    - (command -v mamba >/dev/null 2>&1 && mamba install -p ./env -c conda-forge pandas=2.2.3
      scikit-learn=1.6.1 matplotlib seaborn rdkit=2024.3.2 -y) || ./env/bin/pip install
      pandas==2.2.3 scikit-learn==1.6.1 matplotlib seaborn
    - (command -v mamba >/dev/null 2>&1 && mamba install -p ./env -c pytorch -c nvidia
      pytorch=2.5.1 pytorch-cuda=12.4 -y) || ./env/bin/pip install torch==2.5.1 torchvision
      torchaudio --index-url https://download.pytorch.org/whl/cu124
    - ./env/bin/pip install numpy scipy
    - ./env/bin/pip install fastmcp loguru
    - ./env/bin/pip install --ignore-installed fastmcp
    source: Tool
    url: https://github.com/panda1103/CPMP
