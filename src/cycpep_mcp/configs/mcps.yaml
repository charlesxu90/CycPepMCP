# CycPepMCP - Cyclic Peptide MCP Server Configuration
# Each MCP can be set up by running: cd <path> && bash quick_setup.sh
# The quick_setup.sh script supports: --help, --skip-env, --skip-repo options

mcps:
  cpmp_mcp:
    description: "Cyclic Peptide Membrane Permeability prediction using MAT deep learning"
    path: tool-mcps/cpmp_mcp
    runtime: python
    python_version: "3.10"
    server_command: python
    server_args: [src/server.py]
    setup_script: quick_setup.sh
    url: https://github.com/panda1103/CPMP
    source: Tool
    env_vars: {}
    dependencies: []

