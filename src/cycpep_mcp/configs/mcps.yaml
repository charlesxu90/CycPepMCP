# CycPepMCP - Cyclic Peptide MCP Server Configuration
# Each MCP can be set up by running: cd <path> && bash quick_setup.sh
# The quick_setup.sh script supports: --help, --skip-env, --skip-repo options
# Runtime: "python" (conda env) or "docker" (Docker container from GHCR)

mcps:
  # ==========================================================================
  # Docker MCPs - GPU/CUDA, complex deps, multi-env, or external tools
  # ==========================================================================

  rfpeptides_mcp:
    description: "RFDiffusion All-Atom for cyclic peptide backbone generation"
    path: tool-mcps/rfpeptides_mcp
    runtime: docker
    docker_image: ghcr.io/macronex/rfpeptides_mcp:latest
    docker_args: ["--gpus", "all", "--ipc=host"]
    docker_volumes: []
    python_version: "3.10"
    server_command: python
    server_args: [src/server.py]
    setup_script: quick_setup.sh
    url: https://github.com/macronex/rfpeptides_mcp
    source: Tool
    env_vars: {}
    dependencies: []

