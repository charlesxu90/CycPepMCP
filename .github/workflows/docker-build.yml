name: Build Docker Images

on:
  push:
    branches: [main]
    paths: ['tool-mcps/**']
  workflow_dispatch:
    inputs:
      mcp_name:
        description: 'Specific MCP to build (or "all")'
        required: false
        default: 'all'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: set-matrix
        run: |
          ALL_MCPS='["rfpeptides_mcp","afcycdesign_mcp","rosetta_kic_mcp","highfold_med_mcp","highfold3_mcp","haddock3_mcp","helm_gpt_mcp","cpmp_mcp","proteinmpnn_mcp","ligandmpnn_mcp","boltz_mcp","boltzgen_mcp","alphafold3_mcp","gromacs_mcp","amber_mcp"]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.mcp_name }}" = "all" ] || [ -z "${{ github.event.inputs.mcp_name }}" ]; then
              echo "matrix={\"mcp\":$ALL_MCPS}" >> $GITHUB_OUTPUT
            else
              echo "matrix={\"mcp\":[\"${{ github.event.inputs.mcp_name }}\"]}" >> $GITHUB_OUTPUT
            fi
          else
            # Detect which MCPs changed
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^tool-mcps/' | cut -d/ -f2 | sort -u)
            MATRIX_ITEMS=""
            for mcp in $CHANGED; do
              if echo "$ALL_MCPS" | grep -q "\"$mcp\""; then
                if [ -n "$MATRIX_ITEMS" ]; then MATRIX_ITEMS="$MATRIX_ITEMS,"; fi
                MATRIX_ITEMS="$MATRIX_ITEMS\"$mcp\""
              fi
            done
            if [ -z "$MATRIX_ITEMS" ]; then
              echo "matrix={\"mcp\":[]}" >> $GITHUB_OUTPUT
            else
              echo "matrix={\"mcp\":[$MATRIX_ITEMS]}" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    needs: detect-changes
    if: ${{ fromJson(needs.detect-changes.outputs.matrix).mcp[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./tool-mcps/${{ matrix.mcp }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/macronex/${{ matrix.mcp }}:latest
            ghcr.io/macronex/${{ matrix.mcp }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
